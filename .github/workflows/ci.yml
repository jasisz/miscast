name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: byte-compile the package
        run: python -m compileall miscast
      - name: verdict-classifier unit tests
        run: python tests/test_verdict.py
